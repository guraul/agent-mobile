<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse — Login</title>
<style>
  /* ============================================================
     Pulse B — 登录页。对应真实应用的登录 BottomSheet（index.tsx
     login-sheet：账号/密码/登录），改为独立页面形态，
     皮肤与 pulseB.html 同源：cream + 白卡 + 7 token 字阶 +
     灰底输入行 + 紫渐变主按钮。文案为英文占位，可按需切中文。
     所有数据为 mock；无后台连接。
     ============================================================ */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --cream: #F7F5DC;
    --green-card: #B2D7B5;
    --peach: #F3BA8F;
    --text-gray: #9C9C9C;
    --row-gray: #F0F0F0;
    --ink: #0D0D0D;
    --accent: #8B5CF6;
    --accent-deep: #6D4FD8;
    --green: #5CBB63;
  }

  body {
    background: #000;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Segoe UI", Arial, sans-serif;
    padding: 40px 0;
  }

  /* ===================== PHONE FRAME ===================== */
  .phone {
    position: relative;
    width: 424px;
    height: 884px;
    background: #463E4B;
    border-radius: 68px;
    padding: 15px;
    box-shadow:
      0 0 0 2px #5C5262,
      0 0 0 5px #2C262F,
      0 30px 80px rgba(0,0,0,.9);
    flex-shrink: 0;
  }
  .phone::before {
    content: "";
    position: absolute;
    left: -6px; top: 190px;
    width: 6px; height: 110px;
    background: #3B3440;
    border-radius: 3px 0 0 3px;
    box-shadow: 0 132px 0 #3B3440;
  }
  .phone::after {
    content: "";
    position: absolute;
    right: -6px; top: 260px;
    width: 6px; height: 92px;
    background: #3B3440;
    border-radius: 0 3px 3px 0;
  }

  .screen {
    position: relative;
    width: 100%;
    height: 100%;
    background: var(--cream);
    border-radius: 54px;
    overflow: hidden;
    padding: 0 25px;
    display: flex;
    flex-direction: column;
  }

  /* ===================== STATUS BAR ===================== */
  .statusbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 50px;
    padding-top: 6px;
    position: relative;
  }
  .statusbar .time {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .2px;
    width: 70px;
  }
  .statusbar .icons {
    width: 70px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 5px;
  }
  .island {
    position: absolute;
    left: 50%; top: 12px;
    transform: translateX(-50%);
    width: 122px; height: 36px;
    background: #000;
    border-radius: 20px;
  }
  .island::after {
    content: "";
    position: absolute;
    right: 10px; top: 50%;
    transform: translateY(-50%);
    width: 14px; height: 14px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #2A2A3A 0%, #101018 45%, #000 100%);
  }

  /* ===================== APP HEADER ===================== */
  .app-header {
    margin-top: 10px;
    height: 44px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .app-title {
    font-size: 24px;
    font-weight: 700;
    color: var(--ink);
    user-select: none;
  }

  /* ===================== LOGIN BODY ===================== */
  .content {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 14px 0 60px;
    scrollbar-width: none;
  }
  .content::-webkit-scrollbar { display: none; }

  .greeting {
    margin-top: 34px;
    font-size: 26px;
    line-height: 1.24;
    font-weight: 400;
    color: var(--ink);
  }
  .sub {
    margin-top: 6px;
    font-size: 15px;
    line-height: 1.5;
    color: #6F6F6F;
  }

  .login-card {
    margin-top: 18px;
    background: #FFFFFF;
    border-radius: 24px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .field {
    height: 44px;
    background: var(--row-gray);
    border: none;
    border-radius: 14px;
    padding: 0 14px;
    font-size: 15px;
    font-family: inherit;
    color: #1A1A1A;
    width: 100%;
  }
  .field::placeholder { color: var(--text-gray); }
  .field:focus { outline: none; box-shadow: 0 0 0 1.5px rgba(139,92,246,.4); }
  .btn-primary {
    height: 42px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    background: linear-gradient(135deg, #A78BFA 0%, #8B5CF6 55%, #6D4FD8 100%);
    color: #FFFFFF;
    font-size: 15px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    font-family: inherit;
    transition: transform .15s ease;
  }
  .btn-primary:active { transform: scale(.97); }
  a.btn-primary { text-decoration: none; }
  .hint {
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-gray);
  }

  /* ===================== HOME INDICATOR ===================== */
  .home-indicator {
    position: absolute;
    bottom: 9px;
    left: 50%;
    transform: translateX(-50%);
    width: 145px;
    height: 5px;
    background: #000;
    border-radius: 3px;
    z-index: 20;
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="ic-signal">
      <rect x="0" y="8" width="3" height="4" rx="1" fill="#000"/>
      <rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#000"/>
      <rect x="10" y="3" width="3" height="9" rx="1" fill="#000"/>
      <rect x="15" y="0" width="3" height="12" rx="1" fill="#000"/>
    </g>
    <g id="ic-wifi" fill="#000">
      <path d="M8.5 9.6c.9 0 1.7.4 2.3 1L8.5 13l-2.3-2.4c.6-.6 1.4-1 2.3-1Z"/>
      <path d="M8.5 5.2c2 0 3.9.8 5.3 2.2l-1.6 1.6a5.4 5.4 0 0 0-7.4 0L3.2 7.4a7.5 7.5 0 0 1 5.3-2.2Z"/>
      <path d="M8.5.8c3.2 0 6.2 1.3 8.4 3.4l-1.6 1.6a9.6 9.6 0 0 0-13.6 0L.1 4.2A11.9 11.9 0 0 1 8.5.8Z"/>
    </g>
  </defs>
</svg>

<div class="phone">
  <div class="screen">

    <!-- STATUS BAR -->
    <div class="statusbar">
      <span class="time">19:27</span>
      <div class="island"></div>
      <div class="icons">
        <svg width="19" height="12" viewBox="0 0 19 12"><use href="#ic-signal"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 13"><use href="#ic-wifi"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="#000" stroke-opacity=".4"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill="#000"/>
          <path d="M25.5 4.5v4a2.2 2.2 0 0 0 0-4Z" fill="#000" fill-opacity=".4"/>
        </svg>
      </div>
    </div>

    <!-- APP HEADER：仅居中标题（登录前无 presence、无动作） -->
    <div class="app-header">
      <span class="app-title">Pulse</span>
    </div>

    <!-- LOGIN BODY -->
    <div class="content">
      <h1 class="greeting">Welcome back</h1>
      <p class="sub">Sign in to continue.</p>

      <form class="login-card">
        <input class="field" type="text" placeholder="Username" autocomplete="username">
        <input class="field" type="password" placeholder="Password" autocomplete="current-password">
        <a class="btn-primary" href="pulseB.html">Log in</a>
        <p class="hint">Your account keeps attention, duties and market data in sync.</p>
      </form>
    </div>

    <!-- HOME INDICATOR -->
    <div class="home-indicator"></div>

  </div>
</div>

</body>
</html>
