# APK 构建（2026-11-16 用户拍板：不再走 EAS 排队，改 GitHub Actions）
#
# 为什么放 CI：本仓是公开仓，Actions 分钟数免费；runner 是 x86_64 + 官方 Android SDK，
# 不需要 Termux/arm64 那套 aapt2 特调。本机只负责 `adb install`。
#
# 产物：Actions 页面 Artifacts 里的 pulse-apk（app-release.apk）。
# 签名：Expo 生成的 android 工程 release 默认用 debug keystore —— **只够真机验证，不能上架**。
# 边界：不接 EAS；不把 android/ 入库（.gitignore 已忽略），每次 prebuild 重新生成。

name: build-apk

on:
  workflow_dispatch:
    inputs:
      abi:
        description: '目标 ABI（默认 arm64-v8a，覆盖绝大多数手机）'
        required: false
        default: 'arm64-v8a'
      ref:
        description: '要构建的分支/提交（留空 = 当前默认分支）'
        required: false
        default: ''
  # 打 tag 视为「留一个可安装包」（如 apk-v1.0.1）
  push:
    tags:
      - 'apk-*'
  # PR 只在「可能影响原生构建」的改动上跑：纯 JS 改动的编译问题由 tsc + 测试兜，
  # 不值得每个 PR 都花 14 分钟打一次包（2026-11-17 调整）。
  pull_request:
    paths:
      - 'agent-mobile-app/app.json'
      - 'agent-mobile-app/app.config.js'
      - 'agent-mobile-app/app.config.ts'
      - 'agent-mobile-app/package.json'
      - 'agent-mobile-app/pnpm-lock.yaml'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: agent-mobile-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: agent-mobile-app/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 缓存是这套流程里最划算的一步：RN 依赖编译产物很大，缓存后第二次起快一半以上
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('agent-mobile-app/pnpm-lock.yaml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      # --no-install：依赖已装好，别让 prebuild 再跑一次包管理器
      - name: Prebuild native project
        run: pnpm exec expo prebuild -p android --no-install

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build release APK
        run: |
          set -o pipefail
          ABI="${{ inputs.abi || 'arm64-v8a' }}"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures="$ABI" --no-daemon 2>&1 | tail -60

      - name: Locate APK
        id: apk
        run: |
          set -eu
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "没找到 APK，构建可能失败" >&2; exit 1; fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: pulse-apk
          path: agent-mobile-app/${{ steps.apk.outputs.apk }}
          retention-days: 14
          if-no-files-found: error

      # 传到生产机，让手机能直接下：homebase 的「文件管理器」以 /root/project 为允许根
      # （lib/fileUtils.ts 的 ALLOWED_ROOTS），放到 /root/project/agent-mobile/downloads
      # 就能在 https://<host>:9928/files 里点开下载，不需要新增 Caddy 路由、也不需要新凭据
      # （复用 deploy-web 已在用的 DEPLOY_SSH_KEY）。
      # 只在 tag / 手动构建时发布：PR 构建出来的包不该混进线上目录。
      - name: Publish APK to server (visible in homebase 文件管理器)
        if: github.event_name != 'pull_request'
        run: |
          set -o pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@106.13.181.13"
          VER=$(node -p "require('./app.json').expo.version")
          NAME="pulse-v${VER}-${GITHUB_SHA:0:7}.apk"
          $SSH "mkdir -p /root/project/agent-mobile/downloads"
          rsync -az -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            "${{ steps.apk.outputs.apk }}" \
            "root@106.13.181.13:/root/project/agent-mobile/downloads/$NAME"
          # pulse-latest.apk 指向最新一版；只保留最近 5 个版本
          $SSH "cd /root/project/agent-mobile/downloads && ln -sfn '$NAME' pulse-latest.apk && ls -t pulse-v*.apk | tail -n +6 | xargs -r rm -f && ls -lh"
