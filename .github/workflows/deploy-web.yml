name: deploy-web

on:
  push:
    branches: [main]
    paths:
      - 'agent-mobile-app/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install
        working-directory: agent-mobile-app
        run: pnpm install --frozen-lockfile

      - name: Quality gates (tsc + vitest)
        working-directory: agent-mobile-app
        run: |
          pnpm exec tsc --noEmit
          pnpm test

      - name: Export web bundle
        working-directory: agent-mobile-app
        env:
          EXPO_PUBLIC_OPENCODE_URL: http://106.13.181.13:19234
        run: pnpm exec expo export --platform web --clear

      - name: Setup deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Upload release, flip symlink, restart
        run: |
          RELEASE="run-${GITHUB_RUN_ID}-${GITHUB_SHA::7}"
          WEB=/root/project/agent-mobile/agent-mobile-app
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@106.13.181.13"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            agent-mobile-app/dist/ "root@106.13.181.13:${WEB}/releases/${RELEASE}/"
          $SSH "cd ${WEB} \
            && ln -sfn releases/${RELEASE} dist \
            && systemctl restart serve-9928 \
            && cd releases && ls -1dt */ | tail -n +6 | xargs -r rm -rf"

      - name: Verify production
        run: |
          sleep 2
          CODE=$(curl -s -m 10 -o /dev/null -w '%{http_code}' http://106.13.181.13:9928/)
          echo "9928 -> $CODE"
          if [ "$CODE" != "200" ]; then echo "::error::线上验证失败: $CODE"; exit 1; fi

      # 产物已上线（restart + 验收完成）后，同步服务器上那个「只作阅览用」的克隆，
      # 免得它的 HEAD 一直停在旧提交、只能靠 dist/releases/run-<id>-<sha> 反推线上版本。
      # 前提：该克隆不允许有本地改动；agent-mobile-app/dist 与 agent-mobile-app/releases/
      # 都是部署产物、untracked，reset --hard 不会碰它们，所以生效中的 dist symlink 不受影响。
      # 判脏只看 tracked 改动（--untracked-files=no），否则部署产物本身会让检查永远判脏。
      # 本步失败不影响部署结论（continue-on-error + ::warning::），产物已经在线上。
      - name: Sync server clone
        continue-on-error: true
        run: |
          REPO=/root/project/agent-mobile
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@106.13.181.13"
          DIRTY=$($SSH "git -C ${REPO} status --porcelain --untracked-files=no")
          if [ -n "$DIRTY" ]; then
            echo "::warning::服务器克隆有本地改动，跳过同步（不覆盖别人的临时改动）: $(echo "$DIRTY" | head -3 | tr '\n' ' ')"
            exit 0
          fi
          $SSH "git -C ${REPO} fetch --prune origin" || { echo "::warning::服务器克隆 fetch 失败，跳过同步"; exit 0; }
          $SSH "git -C ${REPO} reset --hard origin/main" || { echo "::warning::服务器克隆 reset 失败（产物已上线，不影响本次部署）"; exit 0; }
          $SSH "git -C ${REPO} log --oneline -1"

      # 部署后冒烟：dist 已切到新 release、9928 已验收，这里再跑一遍真实浏览器 e2e（18 条断言），
      # 免得「PR 合了但界面没上线」只能靠人肉发现。依赖、账号全部复用服务器上现成的
      # agent-mobile-app/.env.local，不引入新 secret。
      # continue-on-error + ::warning::：产物此时已在线上，e2e 失败只告警、不阻断部署（不误报部署失败）。
      # 服务器克隆已由上一步 Sync server clone 重置到 origin/main，这里不再重复 fetch/reset。
      # 加 pipefail：否则 `| tail -40` 会吞掉远端退出码，失败判定永远是成功。
      - name: Post-deploy e2e smoke
        continue-on-error: true
        run: |
          set -o pipefail
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@106.13.181.13"
          if ! $SSH "cd /root/project/agent-mobile/agent-mobile-app && timeout 900 pnpm e2e:nosend" 2>&1 | tail -40; then
            echo "::warning::e2e 冒烟失败（产物已上线，请人工复核）"
          fi
