<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse - Design Showcase</title>
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/layout.css">
</head>
<body>
  <div class="showcase">
    <aside class="sidebar">
      <div class="sidebar__header">
        <div class="sidebar__title">Pulse</div>
        <div class="sidebar__subtitle">Design Showcase</div>
      </div>
      <nav class="sidebar__nav" id="nav-list">
        <button class="nav-item nav-item--active" data-page="pages/dashboard.html">
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          <span class="nav-item__label">Pulse</span>
        </button>
        <button class="nav-item" data-page="pages/conversation.html">
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          <span class="nav-item__label">Talk</span>
        </button>
        <button class="nav-item" data-page="pages/history.html">
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          <span class="nav-item__label">Memory</span>
        </button>
        <button class="nav-item" data-page="pages/settings.html">
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span class="nav-item__label">Me</span>
        </button>

        <div style="padding: var(--space-lg) var(--space-md) var(--space-xs); font-size: 11px; font-weight: 600; color: #5c5a57; letter-spacing: 0.8px; text-transform: uppercase;">Ambient</div>
        <button class="nav-item" data-page="pages/lockscreen.html">
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span class="nav-item__label">Lock Screen</span>
        </button>
        <button class="nav-item" data-page="pages/widget.html">
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span class="nav-item__label">Widget</span>
        </button>
      </nav>
        <div class="sidebar__footer">
        <div class="sidebar__footer-text">VISION_REVIEW v2.0<br>iPhone 16 Pro - 393x852</div>
      </div>
    </aside>

    <div class="preview-area">
      <div class="page-label" id="page-label">Pulse</div>
      <div class="iphone-frame">
        <div class="dynamic-island"></div>
        <div class="iphone-screen">
          <iframe class="iphone-iframe" id="preview-frame" src="pages/dashboard.html"></iframe>
        </div>
        <div class="home-indicator"></div>
      </div>
    </div>
  </div>

  <script src="scripts/navigation.js"></script>
</body>
</html>
